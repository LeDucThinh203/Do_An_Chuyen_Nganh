services:
  # Backend API Service
  - type: web
    name: my-store-backend
    env: docker
    dockerfilePath: ./Backend/my_store_backend/Dockerfile
    dockerContext: ./Backend/my_store_backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: 10
      - key: DB_IDLE_TIMEOUT_MS
        value: 30000
      - key: DB_CONN_TIMEOUT_MS
        value: 15000
      - key: ENABLE_DEMO_ACCOUNTS
        value: "true"
      - key: DEMO_ADMIN_EMAIL
        value: admin@admin.com
      - key: DEMO_ADMIN_PASSWORD
        value: "123456"
      - key: DEMO_USER_EMAIL
        value: user@user.com
      - key: DEMO_USER_PASSWORD
        value: "123456"
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # Frontend Static Site
  - type: web
    name: my-store-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    plan: free
    region: singapore
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://my-store-backend.onrender.com
      - key: REACT_APP_DEMO_ADMIN_EMAIL
        value: admin@admin.com
      - key: REACT_APP_DEMO_ADMIN_PASSWORD
        value: "123456"
      - key: REACT_APP_DEMO_USER_EMAIL
        value: user@user.com
      - key: REACT_APP_DEMO_USER_PASSWORD
        value: "123456"
