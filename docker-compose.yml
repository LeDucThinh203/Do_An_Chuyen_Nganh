version: '3.8'

services:
  # Local PostgreSQL database. Set DATABASE_URL in .env to use another database.
  database:
    image: postgres:16-alpine
    container_name: my_store_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-DBWebBanDoBongDa}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/POSTGRES_RENDER_INIT.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-DBWebBanDoBongDa}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Disposable Redis/Valkey cache. Cache data is safe to lose and will be rebuilt from PostgreSQL.
  cache:
    image: redis:7-alpine
    container_name: my_store_cache
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./Backend/my_store_backend
      dockerfile: Dockerfile
    container_name: my_store_backend
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: database
      DB_USER: ${POSTGRES_USER:-admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      DB_NAME: ${POSTGRES_DB:-DBWebBanDoBongDa}
      DB_PORT: 5432
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-30000}
      DB_CONN_TIMEOUT_MS: ${DB_CONN_TIMEOUT_MS:-15000}
      REDIS_URL: redis://cache:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 3006
      NODE_ENV: production
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    networks:
      - app_network
    volumes:
      - ./Backend/my_store_backend:/app
      - /app/node_modules

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: my_store_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app_network
    environment:
      REACT_APP_API_URL: http://localhost:3006

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
