[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

  [build.environment]
    CI = "false"
    REACT_APP_API_URL = "/api"
    REACT_APP_SOCKET_URL = "https://my-store-backend-4fuu.onrender.com"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://media3.coolmate.me; connect-src 'self' https://my-store-backend-4fuu.onrender.com wss://my-store-backend-4fuu.onrender.com https://provinces.open-api.vn; manifest-src 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[redirects]]
  from = "/api/*"
  to = "https://my-store-backend-4fuu.onrender.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
